---
name: Continuous Integration

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    # Run daily at 9:00 AM UTC
    - cron: '0 9 * * *'

permissions:
  id-token: write
  contents: read

jobs:
  run-tests:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Run tests
        run: python -m pytest

  run-action:
    name: Test Action
    runs-on: ubuntu-latest
    steps:
      # required because action is unpublished
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure login using Federated Credentials
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Test local action
        uses: ./
        with:
          azure-ai-project-endpoint: "https://aoai-qyrftgva6obps.services.ai.azure.com/api/projects/proj-qyrftgva6obps"
          deployment-name: "gpt-4o-mini"
          data-path: ${{ github.workspace }}/samples/data/dataset-tiny.json
          agent-ids: "agentv2test:12,agentv2test:13"

  notify-on-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [run-tests, run-action]
    if: always() && github.event_name == 'schedule' && (needs['run-tests'].result == 'failure' || needs['run-action'].result == 'failure')
    permissions:
      issues: write
    steps:
      - name: Create Issue on Failure
        uses: actions/github-script@v7
        with:
          script: |
            const date = new Date().toISOString().split('T')[0];
            const workflowUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            
            // Check if there's already an open issue with ci-failure label
            const existingIssues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'ci-failure',
              state: 'open'
            });
            
            // Filter out pull requests (listForRepo returns both issues and PRs)
            const actualIssues = existingIssues.data.filter(item => !item.pull_request);
            
            if (actualIssues.length > 0) {
              // Add a comment to the existing issue instead of creating a new one
              const existingIssue = actualIssues[0];
              const commentBody = [
                `## CI Check Failed Again on ${date}`,
                '',
                `**Workflow Run:** ${workflowUrl}`,
                '',
                'The scheduled CI check is still failing. Please investigate.'
              ].join('\n');
              
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body: commentBody
              });
              console.log(`Added comment to existing issue #${existingIssue.number}`);
            } else {
              // Create a new issue if none exists
              const issueBody = [
                '## Daily CI Check Failed',
                '',
                `The scheduled CI workflow failed on ${date}.`,
                '',
                `**Workflow Run:** ${workflowUrl}`,
                '',
                'Please investigate the failure and take appropriate action.',
                '',
                '---',
                '_This issue was automatically created by the scheduled CI workflow._'
              ].join('\n');
              
              const issue = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '🚨 Scheduled CI Check Failed',
                body: issueBody,
                labels: ['ci-failure', 'automated']
              });
              console.log('Created issue:', issue.data.html_url);
            }
